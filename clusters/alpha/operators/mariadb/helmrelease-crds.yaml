apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: mariadb-operator
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: mariadb-operator-crds
      version: "26.6.0"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
