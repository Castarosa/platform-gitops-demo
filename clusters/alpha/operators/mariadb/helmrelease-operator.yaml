apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: mariadb-operator
  dependsOn:
    - name: mariadb-operator-crds
  install:
    createNamespace: true
  chart:
    spec:
      chart: mariadb-operator
      version: "26.6.0"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
  values:
    resources:
      requests:
        cpu: 30m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
